name = "voucher-matricula-asur"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# Banco de dados D1 (matrículas, usuários, unidades)
[[d1_databases]]
binding = "DB"
database_name = "voucher-matricula-db"
database_id = "cb5ce1cb-0353-4ec9-911e-dc4bf0d457b2"

# Armazenamento R2 (fotos de retirada e assinaturas)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "voucher-matricula-media"

# Segredo usado para assinar o cookie de sessão.
# Defina com: wrangler pages secret put SESSION_SECRET
# Em desenvolvimento local, coloque em um arquivo .dev.vars (veja .dev.vars.example)
