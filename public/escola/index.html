<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel da Escola | Campanha de Matrícula ASuR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/escola/nova-matricula.css" />
</head>
<body>
  <!-- Camada decorativa (puramente visual, não interativa) -->
  <div class="decor-layer" aria-hidden="true">
    <svg class="decor-icon decor-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H11v16H4.5c-.8 0-1.5-.7-1.5-1.5v-13Z"/><path d="M21 5.5c0-.8-.7-1.5-1.5-1.5H13v16h6.5c.8 0 1.5-.7 1.5-1.5v-13Z"/><path d="M11 4v16"/></svg>
    <svg class="decor-icon decor-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m14.5 3.5 6 6L8 22H2v-6L14.5 3.5Z"/><path d="m13 5 6 6"/></svg>
    <svg class="decor-icon decor-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2.5l2.7 5.7 6.2.7-4.6 4.3 1.2 6.2L12 16.6l-5.5 2.8 1.2-6.2-4.6-4.3 6.2-.7L12 2.5Z"/></svg>
    <svg class="decor-icon decor-notebook" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 3v18M12 8h6M12 12h6M12 16h4"/></svg>
    <svg class="decor-icon decor-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 3 3 10.5l7 2.5M21 3 13.5 21l-2.5-8M21 3 10.5 13.5"/></svg>
    <svg class="decor-icon decor-backpack" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 8V6a5 5 0 0 1 10 0v2"/><rect x="5" y="8" width="14" height="13" rx="2.5"/><path d="M9 8v4h6V8M9 21v-4h6v4"/></svg>
    <svg class="decor-icon decor-star2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2.5l2.7 5.7 6.2.7-4.6 4.3 1.2 6.2L12 16.6l-5.5 2.8 1.2-6.2-4.6-4.3 6.2-.7L12 2.5Z"/></svg>
    <svg class="decor-icon decor-eraser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.5 20H20"/><path d="m6 16 8.5-8.5a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 21H6.5a1 1 0 0 1-.7-1.7L6 18"/></svg>
  </div>

  <div class="app-shell">
    <header class="app-header">
      <div class="app-header-inner">
        <a href="/" class="brand">
          <img src="/img/logo-asur.jpg" class="brand-badge" alt="Rede Adventista de Educação" />
          <span>
            Rede Adventista de Educação
            <small>Painel da Escola</small>
          </span>
        </a>
        <nav class="admin-nav" id="admin-nav" style="display:none">
          <a href="/escola/" class="admin-nav-link" data-nav="escola">Matrículas</a>
          <a href="/loja/" class="admin-nav-link" data-nav="loja">Retiradas</a>
        </nav>
        <div style="display:flex;align-items:center;gap:16px">
          <div class="who">
            <b id="who-nome">-</b>
            <span id="who-unidade">-</span>
          </div>
          <button class="btn btn-outline btn-sm" id="logout-btn">Sair</button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div class="panel matricula-card">
        <div class="matricula-card-header">
          <div class="matricula-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 9.5 12 5l10 4.5-10 4.5-10-4.5Z" />
              <path d="M6 11.8v4.2c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4.2" />
              <path d="M20 9.5V16" />
            </svg>
          </div>
          <div>
            <h2>Nova matrícula</h2>
          </div>
        </div>
        <div class="matricula-divider" aria-hidden="true"></div>

        <div id="form-alert"></div>
        <form id="matricula-form">
          <div class="grid grid-2 matricula-fields">
            <div class="field">
              <label for="nome_responsavel">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7.5" r="4"/></svg>
                Nome do responsável
              </label>
              <input type="text" id="nome_responsavel" required />
            </div>
            <div class="field">
              <label for="cpf_responsavel">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="12" r="2.2"/><path d="M14 10h4M14 14h3"/></svg>
                CPF do responsável
              </label>
              <input type="text" id="cpf_responsavel" inputmode="numeric" placeholder="000.000.000-00" required />
            </div>
            <div class="field">
              <label for="email">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>
                E-mail
              </label>
              <input type="email" id="email" required />
            </div>
            <div class="field">
              <label for="telefone">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3.5l1.5 5-2.3 1.6a12 12 0 0 0 5.7 5.7l1.6-2.3 5 1.5V19a2 2 0 0 1-2.2 2C10.9 20.6 3.4 13.1 3 5.2A2 2 0 0 1 5 4Z"/></svg>
                Telefone
              </label>
              <input type="tel" id="telefone" placeholder="(00) 00000-0000" required />
            </div>
            <div class="field">
              <label for="nome_aluno">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.5V16c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5.5"/></svg>
                Nome do aluno
              </label>
              <input type="text" id="nome_aluno" required />
            </div>
            <div class="field">
              <label for="ra_aluno">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h9L19 6.5V21H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z"/><path d="M15 2.5V6.5H19"/><path d="M8.5 12h7M8.5 15.5h7M8.5 8.5h3.5"/></svg>
                RA do aluno
              </label>
              <input type="text" id="ra_aluno" required />
            </div>
            <div class="field">
              <label for="data_matricula">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
                Data da matrícula
              </label>
              <input type="date" id="data_matricula" required />
            </div>
            <div class="field">
              <label>
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8.5L12 3l8 5.5V21"/><path d="M9 21v-6h6v6M4 21h16"/></svg>
                Unidade escolar
              </label>
              <input type="text" id="unidade_display" disabled />
              <select id="unidade_select" style="display:none" disabled>
                <option value="" disabled selected>Selecione a unidade...</option>
              </select>
            </div>
            <div class="field">
              <label>
                <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1c1.5 0 2.5.8 2.5 2s-1 1.7-2.5 2-2.5.8-2.5 2 1 2 2.5 2a2.5 2.5 0 0 0 2.5-1"/></svg>
                Valor do voucher
              </label>
              <input type="text" id="voucher_valor_display" disabled />
              <div class="hint">Calculado automaticamente pela data da matrícula.</div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary matricula-submit" id="submit-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5 12 5l10 4.5-10 4.5-10-4.5Z" /><path d="M6 11.8v4.2c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4.2" /><path d="M20 9.5V16" /></svg>
            Cadastrar matrícula
          </button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-title">
          <h2 id="lista-title">Matrículas cadastradas por esta unidade</h2>
          <span id="total-label" style="font-size:13px;color:var(--text-muted)"></span>
        </div>
        <div id="lista-wrap" class="table-wrap">
          <p class="loading">Carregando...</p>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" style="display:none">
    <div class="modal">
      <div class="modal-title">
        <h3 id="modal-title-text">Detalhes da matrícula</h3>
        <button class="close-btn" id="modal-close">&times;</button>
      </div>

      <dl class="detail-list" id="modal-detail"></dl>

      <div id="modal-alert"></div>

      <form id="edit-form" style="display:none">
        <div class="grid grid-2 matricula-fields">
          <div class="field">
            <label for="edit_nome_responsavel">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7.5" r="4"/></svg>
              Nome do responsável
            </label>
            <input type="text" id="edit_nome_responsavel" required />
          </div>
          <div class="field">
            <label for="edit_cpf_responsavel">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="12" r="2.2"/><path d="M14 10h4M14 14h3"/></svg>
              CPF do responsável
            </label>
            <input type="text" id="edit_cpf_responsavel" inputmode="numeric" placeholder="000.000.000-00" required />
          </div>
          <div class="field">
            <label for="edit_email">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>
              E-mail
            </label>
            <input type="email" id="edit_email" required />
          </div>
          <div class="field">
            <label for="edit_telefone">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3.5l1.5 5-2.3 1.6a12 12 0 0 0 5.7 5.7l1.6-2.3 5 1.5V19a2 2 0 0 1-2.2 2C10.9 20.6 3.4 13.1 3 5.2A2 2 0 0 1 5 4Z"/></svg>
              Telefone
            </label>
            <input type="tel" id="edit_telefone" placeholder="(00) 00000-0000" required />
          </div>
          <div class="field">
            <label for="edit_nome_aluno">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.5V16c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5.5"/></svg>
              Nome do aluno
            </label>
            <input type="text" id="edit_nome_aluno" required />
          </div>
          <div class="field">
            <label for="edit_ra_aluno">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h9L19 6.5V21H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z"/><path d="M15 2.5V6.5H19"/><path d="M8.5 12h7M8.5 15.5h7M8.5 8.5h3.5"/></svg>
              RA do aluno
            </label>
            <input type="text" id="edit_ra_aluno" required />
          </div>
          <div class="field">
            <label for="edit_data_matricula">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
              Data da matrícula
            </label>
            <input type="date" id="edit_data_matricula" required />
          </div>
          <div class="field">
            <label>
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1c1.5 0 2.5.8 2.5 2s-1 1.7-2.5 2-2.5.8-2.5 2 1 2 2.5 2a2.5 2.5 0 0 0 2.5-1"/></svg>
              Valor do voucher
            </label>
            <input type="text" id="edit_voucher_valor_display" disabled />
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:10px">
          <button type="submit" class="btn btn-primary matricula-submit" id="edit-submit-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            Salvar alterações
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/masks.js"></script>
  <script src="/js/voucher-valor.js"></script>
  <script src="/escola/app.js"></script>
</body>
</html>
